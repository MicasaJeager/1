name: Deploy NFT Vote Frontend

on:
  push:
    branches: ["main"]
    paths:
      - "13_nft_vote_dapp/frontend/**"
      - ".github/workflows/deploy-nft-vote-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-nft-vote"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_CONTRACT_ADDRESS: ${{ secrets.VITE_NFT_CONTRACT_ADDRESS }}
      VITE_NETWORK_NAME: ${{ secrets.VITE_NFT_NETWORK_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 13_nft_vote_dapp/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: 13_nft_vote_dapp/frontend

      - name: Build
        run: npm run build
        working-directory: 13_nft_vote_dapp/frontend

      - name: Setup pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 13_nft_vote_dapp/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

